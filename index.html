<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uso de VGI Digital</title>
<meta name="description" content="Uso real y público de VGI Digital, la herramienta de escalas de la Valoración Geriátrica Integral. Datos de GoatCounter leídos cada 15 minutos.">
<meta property="og:title" content="Uso de VGI Digital">
<meta property="og:description" content="Sesiones, escalas consultadas y países, con datos públicos que se actualizan cada 15 minutos.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://drcllano.github.io/vgi-uso/">
<meta property="og:image" content="https://drcllano.github.io/vgi-uso/vista-previa.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Uso de VGI Digital: barras con las sesiones por día desde el lanzamiento">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Uso de VGI Digital">
<meta name="twitter:description" content="Sesiones, escalas consultadas y países, con datos públicos que se actualizan cada 15 minutos.">
<meta name="twitter:image" content="https://drcllano.github.io/vgi-uso/vista-previa.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f6b'/%3E%3Cpath d='M7 20l5-6 4 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="cabeza">
  <div class="cabeza-in">
    <div class="marca">
      <div class="ceja">VGI Digital</div>
      <h1>Uso de la app</h1>
    </div>
    <div class="controles">
      <span class="vivo" id="vivo" data-estado="cargando" role="status" aria-live="polite"><i></i><span id="vivo-txt">Cargando</span></span>
      <div class="periodos" role="group" aria-label="Periodo">
        <button type="button" data-p="7" aria-pressed="false">7 días</button>
        <button type="button" data-p="30" aria-pressed="false">30 días</button>
        <button type="button" data-p="todo" aria-pressed="true">Todo</button>
      </div>
      <button type="button" class="boton" id="btn-actualizar" title="Vuelve a cargar la última lectura"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg><span class="btn-texto">Actualizar</span></button>
      <button type="button" class="boton" id="btn-menu" aria-controls="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menú</button>
    </div>
    <div class="lectura" id="lectura">Leyendo los datos públicos de GoatCounter</div>
  </div>
</header>

<div class="velo" id="velo"></div>
<div class="marco">
  <nav class="menu" id="menu" aria-label="Secciones">
    <a href="#panorama" data-v="panorama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><b>Panorama</b><kbd>1</kbd><small>Cifras del periodo</small></a>
    <a href="#dia" data-v="dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><b>Día a día</b><kbd>2</kbd><small>Sesiones y semanas</small></a>
    <a href="#reloj" data-v="reloj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b>Reloj</b><kbd>3</kbd><small>Hora a hora</small></a>
    <a href="#calor" data-v="calor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg><b>Mapa de calor</b><kbd>4</kbd><small>Día por hora</small></a>
    <a href="#fichas" data-v="fichas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg><b>Fichas</b><kbd>5</kbd><small>Escalas de la VGI</small></a>
    <a href="#audiencia" data-v="audiencia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><b>Audiencia</b><kbd>6</kbd><small>Países y dispositivos</small></a>
    <a href="#datos" data-v="datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg><b>Datos y método</b><kbd>7</kbd><small>Descargas y cómo citar</small></a>
  </nav>

  <main id="contenido">
    <section class="vista" id="v-panorama" data-v="panorama" aria-labelledby="t-panorama"></section>
    <section class="vista" id="v-dia" data-v="dia" aria-labelledby="t-dia"></section>
    <section class="vista" id="v-reloj" data-v="reloj" aria-labelledby="t-reloj"></section>
    <section class="vista" id="v-calor" data-v="calor" aria-labelledby="t-calor"></section>
    <section class="vista" id="v-fichas" data-v="fichas" aria-labelledby="t-fichas"></section>
    <section class="vista" id="v-audiencia" data-v="audiencia" aria-labelledby="t-audiencia"></section>
    <section class="vista" id="v-datos" data-v="datos" aria-labelledby="t-datos"></section>
    <p class="cargando" id="cargando">Cargando los datos…</p>
  </main>
</div>

<script src="d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
